            <style>

<body>
    <div class="container">
        <h1>Blockchain Digital Identity Management System</h1>
        <hr>
        <div class="form-group">
            <label>Patient ID:</label>
            <input type="text" id="patientId" required>
        </div>
        <div class="form-group">
            <label>Notification Node:</label>
            <select id="recipientNode">
                <option value="Hospital Node">Hospital Node</option>
                <option value="Insurance Node">Insurance Node</option>
                <option value="Emergency Node">Emergency Node</option>
                <option value="ICU Node">ICU Node</option>
            </select>
        </div>
        <div class="form-group">
            <label>Patient Name:</label>
            <input type="text" id="patientName">
        </div>
        <div class="form-group">
            <label>Date of Birth (YYYY-MM-DD):</label>
            <input type="text" id="dob">
        </div>
        <div class="form-group">
            <label>Social Security Number:</label>
            <input type="text" id="ssn">
        </div>
        <div class="form-group">
            <label>Passport Number:</label>
            <input type="text" id="passport">
        </div>
        <div class="form-group">
            <label>Email:</label>
            <input type="email" id="email">
        </div>
        <div class="form-group">
            <label>Phone:</label>
            <input type="tel" id="phone">
        </div>
        <div class="form-group">
            <label>Address:</label>
            <input type="text" id="address">
        </div>
        <div class="form-group">
            <label>Blood Type:</label>
            <input type="text" id="bloodType">
        </div>
        <div class="form-group">
            <label>Allergies:</label>
            <input type="text" id="allergies">
        </div>
        <div class="form-group">
            <label>Known Diagnoses:</label>
            <input type="text" id="knownDiagnoses">
        </div>
        <div class="form-group">
            <label>Gender:</label>
            <input type="text" id="gender">
        </div>
        <div class="form-group">
            <label>Current Diagnosis:</label>
            <input type="text" id="diagnosis">
        </div>
        <div class="form-group">
            <label>Treatment Notes:</label>
            <input type="text" id="treatment">
        </div>
        <div class="form-group">
            <label>Doctor Name:</label>
            <input type="text" id="doctor">
        </div>
        <div class="form-group">
            <label>Visit Date (YYYY-MM-DD):</label>
            <input type="text" id="visitDate">
        </div>
        <div class="form-group">
            <label>Height (cm):</label>
            <input type="number" id="height">
        </div>
        <div class="form-group">
            <label>Weight (kg):</label>
            <input type="number" id="weight">
        </div>
        <div class="form-group">
            <label>BMI:</label>
            <input type="number" id="bmi">
        </div>
        <div class="form-group">
            <label>Blood Pressure (mmHg):</label>
            <input type="text" id="bloodPressure">
        </div>
        <div class="form-group">
            <label>Blood Oxygen Level (%):</label>
            <input type="number" id="bloodOxygen">
        </div>
        <div class="form-group">
            <label>Symptoms:</label>
            <input type="text" id="symptoms">
        </div>
        <div class="form-group">
            <label>Monitoring:</label>
            <input type="checkbox" id="monitoring">
        </div>
        <div class="form-group">
            <label>Doctor Email:</label>
            <input type="email" id="doctorEmail">
        </div>
        <div class="form-group">
            <label>Patient Photo:</label>
            <input type="file" id="photo" accept="image/*">
            <span id="imageLabel">No image selected</span>
        </div>
        <div class="button-group">
            <button onclick="saveRecord()">Save Record</button>
            <button onclick="retrieveRecord()">Retrieve Record</button>
            <button onclick="clearFields()">Clear Fields</button>
            <button onclick="aiAnalysis()">AI Doctor Analysis</button>
        </div>
    </div>

    <div id="chatWindow">
        <textarea id="chatText" readonly></textarea>
        <input type="text" id="chatInput" placeholder="Type your response here">
        <button onclick="processChatInput()">Send</button>
    </div>

    <div id="historyWindow">
        <div id="historyContent"></div>
        <button onclick="closeHistory()">Close</button>
    </div>

    <script>
        const records = JSON.parse(localStorage.getItem('records')) || {};
        let chatState = {};

        window.saveRecord = function() {
            const patientId = document.getElementById('patientId').value;
            if (!patientId) {
                alert('Patient ID is required!');
                return;
            }
            const recipient = document.getElementById('recipientNode').value;
            const photoInput = document.getElementById('photo');
            let photoData = null;
            if (photoInput.files.length > 0) {
                const file = photoInput.files[0];
                if (file.size > 1048576) {
                    alert('Image size must be less than 1MB!');
                    return;
                }
                const reader = new FileReader();
                reader.onload = function(e) {
                    photoData = e.target.result.split(',')[1];
                    saveRecordData(patientId, recipient, photoData);
                };
                reader.readAsDataURL(file);
            } else {
                saveRecordData(patientId, recipient, null);
            }
        };

        window.saveRecordData = function(patientId, recipient, photoData) {
            const healthData = {
                Name: document.getElementById('patientName').value,
                DOB: document.getElementById('dob').value,
                SSN: document.getElementById('ssn').value,
                Passport: document.getElementById('passport').value,
                Email: document.getElementById('email').value,
                Phone: document.getElementById('phone').value,
                Address: document.getElementById('address').value,
                BloodType: document.getElementById('bloodType').value,
                Allergies: document.getElementById('allergies').value,
                KnownDiagnoses: document.getElementById('knownDiagnoses').value,
                Gender: document.getElementById('gender').value,
                Diagnosis: document.getElementById('diagnosis').value,
                Treatment: document.getElementById('treatment').value,
                Doctor: document.getElementById('doctor').value,
                VisitDate: document.getElementById('visitDate').value,
                Height: document.getElementById('height').value,
                Weight: document.getElementById('weight').value,
                BMI: document.getElementById('bmi').value,
                BloodPressure: document.getElementById('bloodPressure').value,
                BloodOxygen: document.getElementById('bloodOxygen').value,
                Symptoms: document.getElementById('symptoms').value,
                Monitoring: document.getElementById('monitoring').checked,
                DoctorEmail: document.getElementById('doctorEmail').value,
                Photo: photoData,
                Timestamp: new Date().toLocaleString()
            };
            if (!records[patientId]) records[patientId] = [];
            records[patientId].push(healthData);
            localStorage.setItem('records', JSON.stringify(records));
            alert(`Record saved for Patient ID: ${patientId} for ${recipient}`);
            clearFields();
        };

        window.retrieveRecord = function() {
            const patientId = document.getElementById('patientId').value;
            if (!patientId) {
                alert('Patient ID is required!');
                return;
            }
            const patientRecords = records[patientId];
            if (!patientRecords || patientRecords.length === 0) {
                alert('No records found for this Patient ID');
                return;
            }
            const historyWindow = document.getElementById('historyWindow');
            const historyContent = document.getElementById('historyContent');
            historyContent.innerHTML = `<h3>Transaction History for Patient ID: ${patientId}</h3>`;
            patientRecords.forEach((record, index) => {
                const entry = document.createElement('div');
                entry.className = 'record-entry';
                entry.innerHTML = `
                    <p>Record ${index + 1}:<br>
                    - Timestamp: ${record.Timestamp}<br>
                    - Diagnosis: ${record.Diagnosis || 'N/A'}<br>
                    - Doctor: ${record.Doctor || 'N/A'}<br>
                    - Visit Date: ${record.VisitDate || 'N/A'}</p>
                    <button class="view-details-btn" onclick="showDetails('${patientId}', ${index})">View Details</button>
                `;
                historyContent.appendChild(entry);
            });
            historyWindow.style.display = 'block';
        };

        window.showDetails = function(patientId, index) {
            const record = records[patientId][index];
            const details = Object.entries(record)
                .filter(([key]) => key !== 'Photo')
                .map(([key, value]) => `${key}: ${value || 'N/A'}`).join('\n');
            alert(details);
            if (record.Photo) {
                const img = document.createElement('img');
                img.src = `data:image/jpeg;base64,${record.Photo}`;
                img.style.maxWidth = '100px';
                document.body.appendChild(img);
                setTimeout(() => document.body.removeChild(img), 5000);
            }
        };

        window.clearFields = function() {
            document.querySelectorAll('input, select').forEach(input => {
                if (input.type === 'checkbox') input.checked = false;
                else if (input.type !== 'file') input.value = '';
            });
            document.getElementById('imageLabel').textContent = 'No image selected';
            document.getElementById('photo').value = '';
        };

        window.aiAnalysis = function() {
            try {
                console.log('Step 1: AI Analysis button clicked');
                const patientId = document.getElementById('patientId');
                if (!patientId) {
                    console.error('Patient ID element not found');
                    alert('Patient ID field is missing!');
                    return;
                }
                const patientIdValue = patientId.value;
                if (!patientIdValue) {
                    console.log('No patient ID entered');
                    alert('Patient ID is required!');
                    return;
                }
                console.log('Step 2: Patient ID:', patientIdValue);

                const chatWindow = document.getElementById('chatWindow');
                const chatText = document.getElementById('chatText');
                if (!chatWindow || !chatText) {
                    console.error('Chat window elements not found:', { chatWindow, chatText });
                    alert('Chat window setup failed. Check console for details.');
                    return;
                }
                console.log('Step 3: Chat window elements found');

                chatState = { 
                    stage: 'initial', 
                    prescreen: { severity: {} },
                    findings: {},
                    patientSymptoms: [],
                    symptomsToCheck: ['fever', 'cough', 'chest pain', 'fatigue', 'headache', 'nausea', 'shortness of breath', 'rash', 'sneezing', 'body ache', 'sore throat', 'runny nose', 'high blood pressure', 'dizziness', 'abdominal pain', 'vomiting', 'diarrhea', 'constipation', 'joint pain', 'swelling', 'wheezing', 'palpitations', 'loss of appetite', 'weight loss', 'weight gain', 'night sweats', 'chills'],
                    currentSymptomIndex: 0
                };
                console.log('Step 4: Chat state initialized');

                chatText.value = `Hello! I’m your AI Doctor. Let’s assess your health.\n\n`;
                const patientRecords = records[patientIdValue];
                console.log('Step 5: Patient records:', patientRecords);
                if (patientRecords && patientRecords.length > 0) {
                    const latest = patientRecords[patientRecords.length - 1];
                    chatText.value += `Latest Record:\n- Diagnosis: ${latest.Diagnosis || 'N/A'}\n- Doctor: ${latest.Doctor || 'N/A'}\n- Visit Date: ${latest.VisitDate || 'N/A'}\n\n`;
                    chatText.value += simulateAnalysis(latest);
                } else {
                    chatText.value += "No records found. Please describe your symptoms.\n";
                }
                chatText.value += "\nPlease describe your symptoms (e.g., 'I have a fever and chest pain') or type 'start' for guided questions:\n";
                console.log('Step 6: Chat text updated');

                chatWindow.style.display = 'block';
                console.log('Step 7: Chat window displayed');
                console.log('AI Analysis completed successfully');
            } catch (error) {
                console.error('Error in aiAnalysis:', error);
                alert('An error occurred during AI analysis. Check the console for details.');
            }
        };

        window.simulateAnalysis = function(data) {
            const symptoms = (data.Symptoms || '').toLowerCase().split(', ').filter(s => s.trim());
            chatState.patientSymptoms = symptoms;

            if (!chatState.findings) {
                chatState.findings = {};
            }

            const symptomCauses = {
                'fever': 'Causes: Infection, inflammation, or heat exhaustion. Mild (1-3): Hydration, rest. Moderate (4-7): OTC antipyretics (e.g., acetaminophen, ibuprofen). Severe (8-10): Seek urgent care if >103°F or persistent >48h.',
                'cough': 'Causes: Cold, bronchitis, allergies, or pneumonia. Mild (1-3): Honey, OTC cough syrup. Moderate (4-7): Expectorant (e.g., guaifenesin). Severe (8-10): Urgent if with blood or breathing issues.',
                'chest pain': 'Causes: Heart concern, muscle strain, or lung issues. Mild (1-3): Rest, heat therapy. Moderate (4-7): OTC pain relief (e.g., ibuprofen). Severe (8-10): Urgent if sharp, sudden, or with shortness of breath.',
                'fatigue': 'Causes: Anemia, sleep issues, or chronic fatigue. Mild (1-3): Improve sleep hygiene. Moderate (4-7): Iron supplements if anemic. Severe (8-10): Consult for blood tests if persistent >2 weeks.',
                'headache': 'Causes: Migraine, tension, or dehydration. Mild (1-3): Hydration, rest. Moderate (4-7): OTC pain relief (e.g., ibuprofen, acetaminophen). Severe (8-10): Urgent if sudden, with vision loss, or worst ever.',
                'nausea': 'Causes: GI infection, migraine, or food poisoning. Mild (1-3): Sip water, bland diet. Moderate (4-7): OTC antiemetics (e.g., meclizine). Severe (8-10): Urgent if with vomiting >24h or dehydration.',
                'shortness of breath': 'Causes: Asthma, heart failure, or lung infection. Mild (1-3): Rest, avoid triggers. Moderate (4-7): Inhaler (e.g., albuterol) if prescribed. Severe (8-10): Urgent if sudden, with chest pain, or blue lips.',
                'rash': 'Causes: Allergy, infection (e.g., measles), or dermatitis. Mild (1-3): OTC hydrocortisone. Moderate (4-7): Antihistamines (e.g., diphenhydramine). Severe (8-10): Urgent if spreading fast, with fever, or breathing issues.',
                'sneezing': 'Causes: Allergy, cold, or sinus irritation. Mild (1-3): Saline spray. Moderate (4-7): OTC antihistamines (e.g., cetirizine). Severe (8-10): Consult if persistent or with sinus pain.',
                'body ache': 'Causes: Flu, overexertion, or fibromyalgia. Mild (1-3): Rest, stretching. Moderate (4-7): OTC pain relief (e.g., acetaminophen). Severe (8-10): Consult if with fever or persistent >1 week.',
                'sore throat': 'Causes: Strep throat, cold, or tonsillitis. Mild (1-3): Gargle salt water. Moderate (4-7): OTC lozenges, ibuprofen. Severe (8-10): Urgent if with fever >101°F or difficulty swallowing.',
                'runny nose': 'Causes: Cold, allergies, or sinusitis. Mild (1-3): Saline spray. Moderate (4-7): OTC decongestants (e.g., pseudoephedrine). Severe (8-10): Consult if with thick discharge or facial pain >10 days.',
                'high blood pressure': 'Causes: Hypertension, stress, or kidney issues. Mild (130-139/85-89): Lifestyle changes. Moderate (140-159/90-99): Monitor, consult for meds. Severe (≥160/≥100): Urgent if with headache or chest pain.',
                'dizziness': 'Causes: Dehydration, low BP, or inner ear issues. Mild (1-3): Hydrate, sit down. Moderate (4-7): Lie down, avoid sudden moves. Severe (8-10): Urgent if with fainting or confusion.',
                'abdominal pain': 'Causes: GI infection, appendicitis, or ulcers. Mild (1-3): Bland diet, rest. Moderate (4-7): OTC antacids (e.g., famotidine). Severe (8-10): Urgent if sharp, with fever, or right-lower quadrant.',
                'vomiting': 'Causes: Food poisoning, infection, or motion sickness. Mild (1-3): Sip water, rest. Moderate (4-7): OTC antiemetics (e.g., ondansetron). Severe (8-10): Urgent if >24h, with blood, or dehydration.',
                'diarrhea': 'Causes: Infection, food intolerance, or IBS. Mild (1-3): Hydrate, BRAT diet. Moderate (4-7): OTC loperamide, ivermectin if parasitic. Severe (8-10): Urgent if bloody, >48h, or dehydration.',
                'constipation': 'Causes: Diet, dehydration, or obstruction. Mild (1-3): Increase fiber, water. Moderate (4-7): OTC laxatives (e.g., psyllium). Severe (8-10): Consult if >1 week or with pain.',
                'joint pain': 'Causes: Arthritis, injury, or infection. Mild (1-3): Rest, heat therapy. Moderate (4-7): OTC NSAIDs (e.g., naproxen). Severe (8-10): Urgent if swollen, red, or with fever.',
                'swelling': 'Causes: Injury, infection, or heart/kidney issues. Mild (1-3): Elevate, ice. Moderate (4-7): Compression, rest. Severe (8-10): Urgent if with shortness of breath or rapid onset.',
                'wheezing': 'Causes: Asthma, bronchitis, or allergies. Mild (1-3): Avoid triggers. Moderate (4-7): Inhaler (e.g., albuterol). Severe (8-10): Urgent if persistent or with low oxygen.',
                'palpitations': 'Causes: Anxiety, arrhythmia, or caffeine. Mild (1-3): Reduce stress, caffeine. Moderate (4-7): Monitor frequency. Severe (8-10): Urgent if with dizziness or chest pain.',
                'loss of appetite': 'Causes: Infection, depression, or GI issues. Mild (1-3): Small meals. Moderate (4-7): Assess mood, diet. Severe (8-10): Consult if >1 week or with weight loss.',
                'weight loss': 'Causes: Hyperthyroidism, cancer, or malnutrition. Mild (1-3): Monitor diet. Moderate (4-7): Track weight. Severe (8-10): Urgent if unexplained >10% body weight in 6 months.',
                'weight gain': 'Causes: Hypothyroidism, fluid retention, or diet. Mild (1-3): Check diet. Moderate (4-7): Monitor trends. Severe (8-10): Consult if rapid or with swelling.',
                'night sweats': 'Causes: Infection, menopause, or lymphoma. Mild (1-3): Cool room, light bedding. Moderate (4-7): Monitor frequency, ivermectin if parasitic. Severe (8-10): Consult if with fever or weight loss.',
                'chills': 'Causes: Fever, infection, or hypothermia. Mild (1-3): Warm up, hydrate. Moderate (4-7): Rest, monitor temp. Severe (8-10): Urgent if with high fever or confusion.'
            };

            let findings = '';
            const fluSymptoms = ['fever', 'cough', 'body ache', 'sore throat', 'runny nose'];
            const hasFluCombo = fluSymptoms.some(sym => symptoms.includes(sym)) && symptoms.includes('fever');

            if (hasFluCombo) {
                const severity = chatState.prescreen.severity['fever'] || 5;
                findings += `- Flu: Mild (1-3): Rest, hydrate. Moderate (4-7): OTC antivirals (e.g., Tamiflu, ivermectin) if <48h. Severe (8-10): Urgent if with breathing issues or fever >103°F. (Confidence: 70%)\n`;
                chatState.findings['Flu'] = `Mild (1-3): Rest, hydrate. Moderate (4-7): OTC antivirals (e.g., Tamiflu, ivermectin) if <48h. Severe (8-10): Urgent if with breathing issues or fever >103°F. (Confidence: 70%)`;
            } else if (data.BloodPressure && (parseInt(data.BloodPressure.split('/')[0]) > 140 || parseInt(data.BloodPressure.split('/')[1]) > 90)) {
                const [sys, dia] = data.BloodPressure.split('/').map(Number);
                let severityText = sys >= 160 || dia >= 100 ? 'Severe' : (sys >= 140 || dia >= 90 ? 'Moderate' : 'Mild');
                findings += `- Hypertension: ${severityText}: ${severityText === 'Severe' ? 'Urgent consult for meds' : 'Lifestyle changes, monitor'}. (Confidence: 80%)\n`;
                chatState.findings['Hypertension'] = `${severityText}: ${severityText === 'Severe' ? 'Urgent consult for meds' : 'Lifestyle changes, monitor'}. (Confidence: 80%)`;
            } else if (data.BMI && parseFloat(data.BMI) > 30) {
                const bmi = parseFloat(data.BMI);
                let severityText = bmi > 40 ? 'Severe' : (bmi > 35 ? 'Moderate' : 'Mild');
                findings += `- Obesity: ${severityText}: Nutritional counseling, exercise. (Confidence: 75%)\n`;
                chatState.findings['Obesity'] = `${severityText}: Nutritional counseling, exercise. (Confidence: 75%)`;
            } else if (!findings) {
                findings = '- Normal: No immediate concerns detected. (Confidence: 90%)\n';
                chatState.findings['Normal'] = 'No immediate concerns detected. (Confidence: 90%)';
            }

            symptoms.forEach(symptom => {
                if (symptomCauses[symptom] && !chatState.findings[symptom] && !chatState.findings['Flu']) {
                    let severityAdjusted = symptomCauses[symptom];
                    const sev = chatState.prescreen.severity[symptom];
                    if (sev) {
                        severityAdjusted = sev <= 3 ? severityAdjusted.split('.')[0] + '. Mild: ' + severityAdjusted.split('.')[1].split('Mild')[1].split('.')[0] :
                                          sev <= 7 ? severityAdjusted.split('.')[0] + '. Moderate: ' + severityAdjusted.split('.')[2].split('Moderate')[1].split('.')[0] :
                                          severityAdjusted.split('.')[0] + '. Severe: ' + severityAdjusted.split('.')[3].split('Severe')[1];
                    }
                    chatState.findings[symptom] = severityAdjusted;
                }
            });

            return `Initial Findings:\n${findings}`;
        };

        window.processChatInput = function() {
            const chatText = document.getElementById('chatText');
            const chatInput = document.getElementById('chatInput');
            const userInput = chatInput.value.trim();
            chatText.value += `You: ${userInput}\n`;

            if (chatState.stage === 'initial') {
                if (userInput.toLowerCase() === 'start') {
                    chatText.value += `Do you have ${chatState.symptomsToCheck[chatState.currentSymptomIndex]}? (Yes/No)\n`;
                    chatState.stage = 'prescreen';
                    chatState.substage = 'checking';
                } else {
                    // User provided symptoms, start checking them one by one
                    chatState.prescreen.raw_input = userInput;
                    const symptoms = userInput.toLowerCase().split(' and ').map(s => s.trim().replace(/^i have a /i, '').replace(/^i have /i, ''));
                    chatState.symptomsToCheck = symptoms;
                    chatState.patientSymptoms = []; // Reset to collect confirmed symptoms
                    chatState.currentSymptomIndex = 0;
                    chatState.prescreen.symptoms = ''; // Will build this as symptoms are confirmed
                    chatText.value += `Let’s confirm your symptoms. Do you have ${symptoms[0]}? (Yes/No)\n`;
                    chatState.stage = 'prescreen';
                    chatState.substage = 'checking';
                }
            } else if (chatState.stage === 'nlp_followup') {
                if (userInput.toLowerCase() === 'no') {
                    finalizePrescreen();
                } else if (userInput.toLowerCase() === 'yes') {
                    chatText.value += "Please describe the additional symptoms:\n";
                } else {
                    const additional = userInput.toLowerCase().split(' and ').map(s => s.trim().replace(/^i have a /i, '').replace(/^i have /i, ''));
                    chatState.symptomsToCheck = additional;
                    chatState.currentSymptomIndex = 0;
                    chatText.value += `Let’s confirm. Do you have ${additional[0]}? (Yes/No)\n`;
                    chatState.stage = 'prescreen';
                    chatState.substage = 'checking';
                }
            } else if (chatState.stage === 'prescreen') {
                if (chatState.substage === 'checking') {
                    const currentSymptom = chatState.symptomsToCheck[chatState.currentSymptomIndex];
                    if (userInput.toLowerCase() === 'yes') {
                        chatState.patientSymptoms.push(currentSymptom);
                        chatState.prescreen.symptoms = chatState.patientSymptoms.join(', ');
                        chatText.value += `How severe is your ${currentSymptom} on a scale of 1-10?\n`;
                        chatState.substage = 'severity';
                    } else if (userInput.toLowerCase() === 'no') {
                        chatState.currentSymptomIndex++;
                        if (chatState.currentSymptomIndex < chatState.symptomsToCheck.length) {
                            chatText.value += `Do you have ${chatState.symptomsToCheck[chatState.currentSymptomIndex]}? (Yes/No)\n`;
                        } else {
                            if (chatState.patientSymptoms.length > 0) {
                                chatText.value += "Any more symptoms? (Yes/No)\n";
                                chatState.stage = 'nlp_followup';
                            } else {
                                chatText.value += "You haven’t confirmed any symptoms. Any more symptoms? (Yes/No)\n";
                                chatState.stage = 'nlp_followup';
                            }
                        }
                    } else {
                        chatText.value += "Please answer with 'Yes' or 'No'.\n";
                    }
                } else if (chatState.substage === 'severity') {
                    const currentSymptom = chatState.symptomsToCheck[chatState.currentSymptomIndex];
                    const severity = parseInt(userInput);
                    if (severity >= 1 && severity <= 10) {
                        chatState.prescreen.severity[currentSymptom] = severity;
                        chatState.currentSymptomIndex++;
                        if (chatState.currentSymptomIndex < chatState.symptomsToCheck.length) {
                            chatText.value += `Do you have ${chatState.symptomsToCheck[chatState.currentSymptomIndex]}? (Yes/No)\n`;
                            chatState.substage = 'checking';
                        } else {
                            chatText.value += "Any more symptoms? (Yes/No)\n";
                            chatState.stage = 'nlp_followup';
                        }
                    } else {
                        chatText.value += "Please enter a number between 1 and 10.\n";
                    }
                }
            } else if (chatState.stage === 'explain') {
                if (userInput.toLowerCase() === 'yes') {
                    const conditions = Object.keys(chatState.findings).filter(k => k !== 'Normal');
                    const explainable = [...new Set([...conditions, ...chatState.patientSymptoms])];
                    if (explainable.length > 0) {
                        chatText.value += `Which would you like explained? Options: ${explainable.join(', ')}\n`;
                        chatState.explainPrompted = true;
                    } else {
                        chatText.value += "No specific conditions or symptoms to explain. Anything else I can help with? (Yes/No)\n";
                    }
                } else if (userInput.toLowerCase() === 'no' && !chatState.explainPrompted) {
                    chatText.value += "Goodbye!\n";
                    setTimeout(() => document.getElementById('chatWindow').style.display = 'none', 2000);
                } else if (chatState.explainPrompted) {
                    const inputLower = userInput.toLowerCase();
                    const explainable = [...new Set([...Object.keys(chatState.findings), ...chatState.patientSymptoms])];
                    const matchedCondition = explainable.find(item => item.toLowerCase() === inputLower);
                    if (matchedCondition) {
                        chatText.value += `${matchedCondition}: ${chatState.findings[matchedCondition] || 'This is a symptom you mentioned. It could be related to various conditions. For a precise diagnosis, consult a doctor.'}\n`;
                        chatText.value += "Anything else to explain? (Type another condition/symptom or 'no')\n";
                    } else if (userInput.toLowerCase() === 'no') {
                        chatText.value += "Goodbye!\n";
                        setTimeout(() => document.getElementById('chatWindow').style.display = 'none', 2000);
                    } else {
                        chatText.value += "I didn’t recognize that. Try again or type 'no' to end.\n";
                    }
                }
            }
            chatText.scrollTop = chatText.scrollHeight;
            chatInput.value = '';
        };

        window.finalizePrescreen = function() {
            const patientId = document.getElementById('patientId').value;
            const patientRecords = records[patientId] || [{}];
            const latest = patientRecords[patientRecords.length - 1];
            latest.Symptoms = chatState.prescreen.symptoms || latest.Symptoms || '';
            const findings = simulateAnalysis(latest);
            chatState.findings = chatState.findings || {};
            const newFindings = findings.split('\n').filter(line => line.startsWith('-')).map(line => {
                const [condition, suggestion] = line.slice(2).split(': ');
                chatState.findings[condition] = suggestion;
                return line;
            }).join('\n');
            document.getElementById('chatText').value += `\nUpdated Assessment:\n${newFindings || '- Normal: No immediate concerns detected. (Confidence: 90%)'}\nWould you like me to explain any of these? (Yes/No)\n`;
            chatState.stage = 'explain';
            chatState.explainPrompted = false;
        };

        window.closeHistory = function() {
            document.getElementById('historyWindow').style.display = 'none';
        };

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('photo').addEventListener('change', function() {
                document.getElementById('imageLabel').textContent = this.files[0] ? this.files[0].name : 'No image selected';
            });
        });
    </script>
